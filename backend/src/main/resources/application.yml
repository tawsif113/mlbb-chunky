spring:
  application:
    name: mlbb-chunky
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mlbb_chunky}
    username: ${DB_USERNAME:chunky}
    password: ${DB_PASSWORD:chunky}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  auth:
    session-days: ${CHUNKY_SESSION_DAYS:30}
    secure-cookie: ${CHUNKY_SECURE_COOKIE:false}
  mlbb:
    # none = use no external provider; rone = use the unofficial Rone Arena hosted API.
    identity-provider: ${MLBB_IDENTITY_PROVIDER:none}
    data-provider: ${MLBB_DATA_PROVIDER:none}
    hero-sync-on-startup: ${MLBB_HERO_SYNC_ON_STARTUP:false}
    meta-sync-on-startup: ${MLBB_META_SYNC_ON_STARTUP:false}
    meta:
      rank-scope: ${MLBB_META_RANK_SCOPE:all}
      period-days: ${MLBB_META_PERIOD_DAYS:7}
    rone:
      base-url: ${RONE_ARENA_BASE_URL:https://arena.rone.dev/api}

server:
  port: ${PORT:8080}
